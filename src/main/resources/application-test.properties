# Override external API URL for integration tests (WireMock)
randomuser.base-url=http://localhost:${wiremock.server.port:8081}

# Disable circuit breaker in tests for predictable behavior
resilience4j.circuitbreaker.instances.randomUserApi.enabled=false

# Speed up tests - no retry delays
resilience4j.retry.instances.randomUserApi.max-attempts=1